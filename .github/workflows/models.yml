name: models

# Runs the smoke tests against the real committed weights and a short training run.
# Manual only: every run downloads all Git LFS objects (about 571 MB) and counts
# against the repository's LFS bandwidth quota.
on:
  workflow_dispatch:
  # Uncomment for a weekly run. Each run downloads about 571 MB of LFS objects,
  # which counts against the repository's LFS bandwidth.
  # schedule:
  #   - cron: "0 6 * * 1"

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt -r requirements/train.txt

      - name: Check that no LFS pointer files remain under models/
        run: python scripts/check_lfs_pointers.py

      - name: Run tests with real models required
        env:
          REQUIRE_MODELS: "1"
        run: pytest -rs

      - name: Training smoke test (writes outside the repository)
        run: python -m src.training.train_lr --subset 300 --out-dir /tmp/lr_smoke --results-path /tmp/lr_smoke.json
