name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Model weights are not needed: the smoke tests skip on LFS pointers.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "emoji==2.15.0" "numpy==2.3.4" "scikit-learn==1.7.2" "pytest==8.4.2" "ruff==0.13.3"

      - name: Run tests
        run: pytest

      - name: Lint
        run: ruff check .
