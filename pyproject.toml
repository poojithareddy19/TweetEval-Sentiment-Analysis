[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "outputs", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
